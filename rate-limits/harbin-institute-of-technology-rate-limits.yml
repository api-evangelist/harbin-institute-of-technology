specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Harbin Institute of Technology
providerId: harbin-institute-of-technology
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  Harbin Institute of Technology publishes no rate-limit table of any kind, and operates no API
  programme that would carry one. The one anonymously callable machine-readable surface on an HIT
  host is the OAI-PMH endpoint at scholar.hit.edu.cn/ws/oai, which is an Elsevier Pure deployment;
  it declares no limits and no Retry-After behaviour was observed. Harvest politely and honor
  Retry-After if it appears.
correction:
  date: '2026-09-01'
  note: >-
    Corrected 2026-09-01. The prior description asserted throttling on "OAI-PMH, IIIF, library"
    endpoints. No IIIF surface and no library API were ever evidenced for HIT; both were carried
    from generic higher-education boilerplate rather than from a probe. Only the OAI-PMH endpoint
    is real.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
sources:
- https://raw.githubusercontent.com/api-evangelist/harbin-institute-of-technology/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
