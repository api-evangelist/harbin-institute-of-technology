- name: Elsevier Pure web services API (vendor contract, HIT tenancy)
  url: https://scholar.hit.edu.cn/ws/api
  x-operator: tenant
  auth: api_key
  anonymous: false
  detail: >-
    The Pure API is deployed on HIT's host but is NOT anonymously callable. The unversioned
