    detail: 'application/problem+json — {"title":"Request not authorized.","detail":"Full authentication is required to access this resource"}'
  - url: https://scholar.hit.edu.cn/ws/api/524.0/openapi.json
    status: 401
    detail: Versioned contract itself is credential-gated.
  - url: https://scholar.hit.edu.cn/ws/api/openapi.json
    status: 200
    detail: >-
      Unversioned contract IS served anonymously — and it is Elsevier's, titled "Pure API",
      contact pure-support@elsevier.com, 827 paths. Not HIT's contract.
