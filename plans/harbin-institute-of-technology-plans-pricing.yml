specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Harbin Institute of Technology
providerId: harbin-institute-of-technology
created: '2026-06-03'
modified: '2026-09-01'
reconciled: false
tags:
- Education
- Higher Education
- University
- Plans
description: >-
  Harbin Institute of Technology is a non-commercial higher-education institution and sells no API
  access. There is no developer programme, no key issuance, and no priced tier. The single
  anonymously callable machine-readable surface on an HIT host is the OAI-PMH endpoint of its
  Elsevier Pure research portal, which is free and unauthenticated. Everything else is gated by
  campus identity (SAML / SSO) or by an Elsevier-issued Pure API key, neither of which is a plan.
correction:
  date: '2026-09-01'
  note: >-
    Corrected 2026-09-01. The prior description asserted free public "library, repository, course,
    and open-metadata interfaces". Only the open-metadata (OAI-PMH) surface was ever evidenced;
    the library, repository-API and course-catalog interfaces were higher-education boilerplate
    and are removed.
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
sources:
- https://raw.githubusercontent.com/api-evangelist/harbin-institute-of-technology/refs/heads/main/apis.yml
plans:
- id: harbin-institute-of-technology-free-open
  name: Free / Open
  type: free
  description: Public open APIs (metadata, library, repository, course data) offered at no charge, generally for non-commercial use.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: harbin-institute-of-technology-affiliation
  name: Affiliation / Credentialed
  type: free
  description: Administrative and identity APIs gated behind institutional SSO, client certificates, or federation membership rather than payment.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
