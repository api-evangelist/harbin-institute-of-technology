method: probed
source: live HTTP probes of scholar.hit.edu.cn and idp.hit.edu.cn, 2026-09-01
description: >-
  Domain-standard conformance for Harbin Institute of Technology, measured against the Kin Score
  `education` regime standards[]. Every entry below was confirmed by fetching the endpoint and
