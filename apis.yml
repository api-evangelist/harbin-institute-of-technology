description: >-
  Harbin Institute of Technology (HIT, 哈尔滨工业大学) is a public technical research university in
  Harbin, Heilongjiang, China, founded in 1920, administered by the Ministry of Industry and
  Information Technology, and a member of the C9 League, with additional campuses at Weihai and
  Shenzhen. HIT operates NO public developer programme, no API documentation, no developer portal
  and no API key issuance of any kind, and this profile should be read as recording that absence.
  Its one institution-operated machine-readable surface is a Shibboleth SAML 2.0 identity provider
  at idp.hit.edu.cn, scoped to hit.edu.cn — genuinely HIT's own engineering, though the metadata
  document it publishes is the unedited Shibboleth template and expired in 2020. Every other
  machine-readable surface is a tenancy on Elsevier Pure running under HIT's own hostname
  (scholar.hit.edu.cn): a live and anonymously harvestable OAI-PMH endpoint carrying the OpenAIRE
  CERIF 1.2 profile, RSS feeds of publications and researcher profiles, and a Pure web services API
  that is credential-gated and whose contract belongs to Elsevier, not to HIT. The data in those
  surfaces is HIT's; the contracts are not.
