  description: >-
    OAI-PMH 2.0 harvesting endpoint for HIT's research outputs, persons and datasets, on HIT's own
    hostname and anonymously callable — a ListRecords over publications:all returned 358,884 bytes
    of oai_dc records with no credential. Serves six metadata prefixes (mods, mods_swepub, oai_dc,
    xmetadiss, qdc, nl_didl) across 99 sets, and declares the OpenAIRE Guidelines for CRIS Managers
    CERIF-XML 1.2 profile with a dedicated openaire set. RECORDED AS A TENANCY, NOT AS HIT'S
    CONTRACT: the Identify response names the repository "Pure OAI Repository" and its administrator
    purehosted@elsevier.com, so the software and the hosting are Elsevier's. The data and the
    deployment are HIT's. Note the earliestDatestamp of 2025-10-30 — this Pure instance is less than
    a year old. Reachability from outside China is intermittent at the connection layer; when it
    connects it always returns 200 with a full body.
